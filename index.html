<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12V High Pressure Mini Pump | Portable & Powerful</title>

<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
.container {max-width:600px; margin:auto; background:#fff;}
header {background:#d32f2f; color:#fff; text-align:center; padding:30px;}
h1 {margin:10px 0;}
.section {padding:20px;}
.btn {background:#ff3d00; color:#fff; padding:18px; border:none; width:100%; font-size:18px; border-radius:40px; cursor:pointer;}
.price {color:#d32f2f; font-size:26px; font-weight:bold;}
.card {border:1px solid #eee; padding:15px; margin-bottom:15px; border-radius:12px;}
.badge {background:#ffeb3b; padding:5px 10px; font-weight:bold;}
input, select {width:100%; padding:12px; margin:5px 0; border:1px solid #ddd; border-radius:10px; box-sizing:border-box;}

/* Slider Styles */
#mediaSlider {position:relative; max-width:100%; height:350px; margin-top:15px; border:1px solid #ddd; border-radius:12px; overflow:hidden; background:#000;}
.slide {display:none; text-align:center;}
.slide img, .slide video {width:100%; height:100%; object-fit:contain; border-radius:12px;}
#prevSlide, #nextSlide {position:absolute; top:50%; transform:translateY(-50%); font-size:30px; color:white; font-weight:bold; text-decoration:none; cursor:pointer; user-select:none; background:rgba(0,0,0,0.4); padding:5px 10px; border-radius:5px;}
#prevSlide {left:10px;}
#nextSlide {right:10px;}
#thumbnails {display:flex; justify-content:center; margin-top:10px; gap:5px;}
#thumbnails img, #thumbnails video {width:60px; height:40px; object-fit:cover; cursor:pointer; border:2px solid transparent; border-radius:6px;}
#thumbnails .active {border-color:#ff3d00;}
</style>
</head>

<body>
<div class="container">

<header>
<span class="badge">HOT SALE</span>
<h1>12V HIGH PRESSURE MINI PUMP</h1>
<p>Portable • Powerful • Energy Saving</p>
</header>

<div class="section">
<p style="color:red; font-weight:bold;">⚠ Only 99 units left in stock</p>
<p style="color:#2e7d32; font-weight:bold;">✔ 8,980+ sold this month</p>

<!-- Media Slider -->
<div id="mediaSlider">
  <div class="slide">
    <img src="https://via.placeholder.com/600x350.png?text=Mini+Pump+Image+1" alt="Image 1">
  </div>
  <div class="slide">
    <video controls>
      <source src="https://www.youtube.com/shorts/RWg9nFETMvY" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <div class="slide">
    <img src="https://via.placeholder.com/600x350.png?text=Mini+Pump+Image+2" alt="Image 2">
  </div>

  <a id="prevSlide">&#10094;</a>
  <a id="nextSlide">&#10095;</a>
</div>

<!-- Thumbnails -->
<div id="thumbnails">
  <img src="https://via.placeholder.com/600x350.png?text=Mini+Pump+Image+1" data-index="0" class="active">
  <video data-index="1">
    <source src="videos/minipump.mp4" type="video/mp4">
  </video>
  <img src="" data-index="2">
</div>
</div>

<!-- Chọn gói sản phẩm và quy đổi tiền tệ -->
<div class="section">
<h2>💰 CHOOSE YOUR PACKAGE</h2>

<form id="orderForm">
  <select id="package" name="package" required>
    <option value="50">1 Unit - $50</option>
    <option value="99">2 Units - $99 (Free Shipping)</option>
    <option value="150">3 Units - $150 (Best Deal + Warranty)</option>
  </select>

  <label for="currency_country">Select Country / Currency:</label>
  <select id="currency_country" name="currency_country" required>
    <option value="USD" selected>USA / Canada - $</option>
    <option value="EUR">UK / Europe - €</option>
    <option value="VND">Vietnam - ₫</option>
    <option value="JPY">Japan - ¥</option>
    <option value="INR">India - ₹</option>
  </select>

  <p style="font-size:20px; font-weight:bold;">Price: <span id="converted_price">$50</span></p>

  <input type="hidden" id="final_price" name="final_price" value="50">
  <input type="hidden" id="final_currency" name="final_currency" value="USD">

  <button type="submit" class="btn">🔥 PLACE ORDER NOW</button>
</form>
</div>

<!-- Thông tin đặt hàng -->
<div class="section">
<h2>📦 ORDER DETAILS</h2>

<form>
  <input type="text" name="fullname" placeholder="Full Name" required>

  <label for="phone_country_code">Country Code</label>
  <select id="phone_country_code" name="phone_country_code" required style="width:30%; display:inline-block;">
    <option value="" disabled selected>+Code</option>
    <option value="+1">+1 (USA/Canada)</option>
    <option value="+44">+44 (UK)</option>
    <option value="+84">+84 (Vietnam)</option>
    <option value="+49">+49 (Germany)</option>
    <option value="+33">+33 (France)</option>
    <option value="+81">+81 (Japan)</option>
    <option value="+91">+91 (India)</option>
  </select>

  <input type="tel" id="phone" name="phone" placeholder="Phone Number" 
         pattern="^\d{4,14}$" 
         title="Enter phone number without country code, 4 to 14 digits" 
         required 
         style="width:65%; display:inline-block; vertical-align:top;">

  <input type="text" name="house_number" placeholder="House Number" required>
  <input type="text" name="street_name" placeholder="Street Name" required>
  <input type="text" name="city" placeholder="City" required>
  <input type="text" name="state_province" placeholder="State / Province" required>
  <input type="text" name="postal_code" placeholder="ZIP / Postal Code" required>
</form>
</div>

<div class="section" style="background:#333; color:#fff;">
<h3>CONTACT</h3>
<p>📍 Hanoi, Vietnam</p>
<p>📞 WhatsApp: +84 886 073 622</p>
<p>⏰ 8:00 AM – 9:00 PM</p>
</div>

</div>

<script>
// Tỷ giá cơ bản
const exchangeRates = { USD: 1, EUR: 0.92, VND: 24000, JPY: 150, INR: 83 };
const currencySymbols = { USD: '$', EUR: '€', VND: '₫', JPY: '¥', INR: '₹' };
const packageSelect = document.getElementById('package');
const countrySelect = document.getElementById('currency_country');
const priceDisplay = document.getElementById('converted_price');
const finalPriceInput = document.getElementById('final_price');
const finalCurrencyInput = document.getElementById('final_currency');

function updatePrice() {
  const usdPrice = parseFloat(packageSelect.value);
  const selectedCurrency = countrySelect.value;
  const convertedPrice = usdPrice * exchangeRates[selectedCurrency];
  priceDisplay.textContent = selectedCurrency === "VND" ? 
    currencySymbols[selectedCurrency] + convertedPrice.toLocaleString() :
    currencySymbols[selectedCurrency] + convertedPrice.toFixed(2);
  finalPriceInput.value = convertedPrice.toFixed(2);
  finalCurrencyInput.value = selectedCurrency;
}

packageSelect.addEventListener('change', updatePrice);
countrySelect.addEventListener('change', updatePrice);
updatePrice();

document.getElementById('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert("Order submitted!\nPrice: " + finalPriceInput.value + " " + finalCurrencyInput.value);
});

// Slider logic
let currentSlide = 0;
const slides = document.querySelectorAll("#mediaSlider .slide");
const totalSlides = slides.length;
const thumbnails = document.querySelectorAll("#thumbnails img, #thumbnails video");

function showSlide(index){
  slides.forEach((slide, i) => slide.style.display = (i === index) ? "block" : "none");
  thumbnails.forEach((thumb, i) => thumb.classList.toggle("active", i===index));
}

document.getElementById("prevSlide").addEventListener("click", () => {
  currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
  showSlide(currentSlide);
});

document.getElementById("nextSlide").addEventListener("click", () => {
  currentSlide = (currentSlide + 1) % totalSlides;
  showSlide(currentSlide);
});

thumbnails.forEach(thumb => {
  thumb.addEventListener('click', () => {
    currentSlide = parseInt(thumb.getAttribute('data-index'));
    showSlide(currentSlide);
  });
});

showSlide(currentSlide);
</script>
</body>
</html>
