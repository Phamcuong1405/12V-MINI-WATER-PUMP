<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12V High Pressure Mini Pump</title>

<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
.container {max-width:600px; margin:auto; background:#fff;}
header {background:#d32f2f; color:#fff; text-align:center; padding:30px;}
.section {padding:20px;}
.badge {background:#ffeb3b; padding:5px 10px; font-weight:bold;}
input, select {width:100%; padding:12px; margin:5px 0; border:1px solid #ddd; border-radius:10px;}

.slider {position:relative; border-radius:12px; overflow:hidden; background:#000;}
.slide {display:none;}
.slide img {width:100%; height:100%; object-fit:contain;}
.video-container {position:relative; padding-top:56.25%;}
.video-container iframe {position:absolute; width:100%; height:100%; top:0; left:0;}

.prev, .next {
 position:absolute; top:50%; transform:translateY(-50%);
 color:#fff; font-size:30px; cursor:pointer;
 background:rgba(0,0,0,0.4); padding:5px 10px;
}
.prev {left:10px;} .next {right:10px;}

.btn-order {
  width:100%;
  padding:15px;
  background:#d32f2f;
  color:#fff;
  border:none;
  font-size:18px;
  border-radius:8px;
  margin-top:15px;
  cursor:pointer;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% {transform:scale(1);}
  50% {transform:scale(1.05);}
  100% {transform:scale(1);}
}

/* FLOAT BUTTON */
.float-btn{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 width:90%;
 max-width:500px;
 background:#d32f2f;
 color:#fff;
 text-align:center;
 padding:15px;
 border-radius:10px;
 font-size:18px;
 z-index:999;
 cursor:pointer;
 animation:pulse 1.5s infinite;
}

/* FOMO */
.fomo{
 background:#fff3cd;
 padding:10px;
 text-align:center;
 font-weight:bold;
 color:#d32f2f;
}
</style>

<script src="https://www.paypal.com/sdk/js?client-id=AZVBW8AbbYBa_AueMaS-rhE-Nah0E-g76trzpgzh_kj-nhB3qySFWX9hN0CzRjjNnRwQRaiRu1RH26Dl&currency=USD"></script>

</head>

<body>

<div class="fomo">
🔥 <span id="viewing">18</span> người đang xem • Đã bán <span id="sold">8980</span>
<br>
⏳ Kết thúc ưu đãi sau: <span id="countdown">10:00</span>
</div>

<div class="container">

<header>
<span class="badge">HOT SALE</span>
<h1>12V HIGH PRESSURE MINI PUMP</h1>
<p>Portable • Powerful • Energy Saving</p>
</header>

<div class="section">
<p style="color:red;">⚠ Only 99 units left</p>
</div>

<!-- SPEC -->
<div class="section">
<h3>⚙️ Specifications</h3>
<p>150W • 12V • High Pressure</p>

<button class="btn-order" onclick="scrollToOrder()">ĐẶT HÀNG NGAY</button>
</div>

<!-- FORM -->
<div class="section">
<form id="orderForm">

<input name="fullname" placeholder="Full Name" required>

<select id="countryCode" required>
<option value="+84">🇻🇳 +84</option>
<option value="+1">🇺🇸 +1</option>
</select>

<input name="phone" placeholder="Phone" required>
<input name="city" placeholder="City" required>

<select id="package">
<option value="50">1 Unit</option>
<option value="99">2 Units</option>
</select>

<select id="currency_country" style="display:none;">
<option value="USD">USD</option>
<option value="VND">VND</option>
</select>

<p>Price: <span id="converted_price">$49</span></p>

<input type="hidden" id="final_price">

<button class="btn-order">Đặt hàng</button>

</form>

<div id="paypal-button-container"></div>
</div>

</div>

<!-- FLOAT BUTTON -->
<div class="float-btn" onclick="scrollToOrder()">
🔥 ĐẶT HÀNG NGAY
</div>

<script>

// AUTO COUNTRY
fetch("https://ipapi.co/json/")
.then(res=>res.json())
.then(data=>{
 let map={
  VN:{code:"+84",cur:"VND"},
  US:{code:"+1",cur:"USD"}
 };
 let c=map[data.country_code];
 if(c){
  document.getElementById("countryCode").value=c.code;
  document.getElementById("currency_country").value=c.cur;
  updatePrice();
 }
});

// PRICE
const rates={USD:1,VND:24000};

function optimizePrice(v,c){
 if(c==="USD") return v==50?49:95;
 if(c==="VND") return Math.round(v/1000)*1000-1000;
 return v;
}

function updatePrice(){
 let p=document.getElementById("package").value;
 let c=document.getElementById("currency_country").value;
 let v=p*rates[c];
 v=optimizePrice(v,c);

 document.getElementById("converted_price").innerText=
 c==="VND"?v.toLocaleString()+"₫":"$"+v;

 document.getElementById("final_price").value=v;
}
document.getElementById("package").onchange=updatePrice;
updatePrice();

// SCROLL + FOCUS
function scrollToOrder(){
 document.getElementById("orderForm").scrollIntoView({behavior:"smooth"});
 setTimeout(()=>document.querySelector('[name="fullname"]').focus(),500);
}

// FOMO
setInterval(()=>{
 document.getElementById("viewing").innerText=
 Math.floor(Math.random()*20)+10;
},3000);

setInterval(()=>{
 let s=document.getElementById("sold");
 s.innerText=parseInt(s.innerText)+1;
},5000);

// COUNTDOWN
let time=600;
setInterval(()=>{
 let m=Math.floor(time/60);
 let s=time%60;
 document.getElementById("countdown").innerText=
 m+":"+(s<10?"0"+s:s);
 if(time>0) time--;
},1000);

// PAYPAL
paypal.Buttons({
createOrder:(d,a)=>{
 return a.order.create({
 purchase_units:[{amount:{value:document.getElementById("final_price").value}}]
 });
}
}).render('#paypal-button-container');

</script>

</body>
</html>
