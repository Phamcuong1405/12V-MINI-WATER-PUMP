<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12V High Pressure Mini Pump | Portable & Powerful</title>
<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
.container {max-width:600px; margin:auto; background:#fff; padding-bottom:50px;}
header {background:#d32f2f; color:#fff; text-align:center; padding:30px;}
h1 {margin:10px 0;}
.section {padding:20px;}
.btn {background:#ff3d00; color:#fff; padding:18px; border:none; width:100%; font-size:18px; border-radius:40px; cursor:pointer;}
.price {color:#d32f2f; font-size:26px; font-weight:bold;}
.card {border:1px solid #eee; padding:15px; margin-bottom:15px; border-radius:12px;}
.badge {background:#ffeb3b; padding:5px 10px; font-weight:bold;}
input, select {width:100%; padding:12px; margin:5px 0; border-radius:10px; border:1px solid #ccc; font-size:16px;}
#confirmButton {display:none; width:100%; padding:15px; background:#4CAF50; color:#fff; font-weight:bold; margin:10px 0; cursor:pointer; border:none; border-radius:40px;}
</style>
</head>

<body>
<div class="container">

<header>
<span class="badge">HOT SALE</span>
<h1>12V HIGH PRESSURE MINI PUMP</h1>
<p>Portable • Powerful • Energy Saving</p>
</header>

<div class="section">
<h2>💰 SELECT YOUR PACKAGE</h2>
<select id="packageSelect">
<option value="1 Unit - $10">1 Unit - $10 (Shipping $2)</option>
<option value="2 Units - $20">2 Units - $20 (Free Shipping)</option>
<option value="3 Units - $30">3 Units - $30 (Free Shipping + Warranty)</option>
</select>

<button class="btn" id="placeOrderBtn">🔥 PLACE ORDER NOW</button>
</div>

<div class="section" id="orderForm">
<h2>📦 ORDER INFORMATION</h2>
<form>

  <input type="text" name="fullname" placeholder="Full Name" required>

  <label for="phone_country_code">Country Code</label>
  <select id="phone_country_code" name="phone_country_code" required style="width:30%; display:inline-block;">
    <option value="" disabled selected>+Code</option>
    <option value="+1">+1 (USA/Canada)</option>
    <option value="+44">+44 (UK)</option>
    <option value="+84">+84 (Vietnam)</option>
    <option value="+49">+49 (Germany)</option>
    <option value="+33">+33 (France)</option>
    <option value="+81">+81 (Japan)</option>
    <option value="+91">+91 (India)</option>
  </select>
  <input type="tel" id="phone" name="phone" placeholder="Phone Number" pattern="^\d{4,14}$" title="Enter phone number without country code, 4 to 14 digits" required style="width:65%; display:inline-block; vertical-align:top;">

  <input type="text" name="house_number" placeholder="House Number" required>
  <input type="text" name="street_name" placeholder="Street Name" required>
  <input type="text" name="city" placeholder="City" required>
  <input type="text" name="state_province" placeholder="State / Province" required>
  <input type="text" name="postal_code" placeholder="ZIP / Postal Code" required>

  <button type="submit" id="confirmButton">✅ CONFIRM ORDER</button>
</form>
</div>

<div class="section" style="background:#333; color:#fff;">
<h3>CONTACT</h3>
<p>📍 Hanoi, Vietnam</p>
<p>📞 WhatsApp: +84 886 073 622</p>
<p>⏰ 8:00 AM – 9:00 PM</p>
</div>

</div>

<script>
// 1. Scroll xuống form khi nhấn PLACE ORDER
document.getElementById('placeOrderBtn').addEventListener('click', function(){
    document.getElementById('orderForm').scrollIntoView({behavior:'smooth'});
});

// 2. Kiểm tra trường bắt buộc và hiển thị nút Confirm
document.querySelector('#orderForm form').addEventListener('submit', function(e){
    e.preventDefault();
    let form = e.target;
    let fields = ['fullname','phone_country_code','phone','house_number','street_name','city','state_province','postal_code'];
    let missing = [];

    fields.forEach(f => {
        let input = form.querySelector('[name="'+f+'"]');
        if(!input.value.trim()) missing.push(input.placeholder);
    });

    if(missing.length > 0){
        alert('Please fill in the following fields:\n' + missing.join('\n'));
    } else {
        alert('All information completed. Click "Confirm Order" to finalize.');
        document.getElementById('confirmButton').style.display = 'block';
    }
});

// 3. Gửi dữ liệu sang Google Sheet khi nhấn Confirm Order
document.getElementById('confirmButton').addEventListener('click', function(){
    let form = document.querySelector('#orderForm form');
    let data = {
        fullname: form.fullname.value,
        phone_country_code: form.phone_country_code.value,
        phone: form.phone.value,
        house_number: form.house_number.value,
        street_name: form.street_name.value,
        city: form.city.value,
        state_province: form.state_province.value,
        postal_code: form.postal_code.value,
        package: document.getElementById('packageSelect').value
    };

    fetch('YOUR_GOOGLE_SCRIPT_URL', { // Thay bằng URL Web App Google Script
        method: 'POST',
        body: JSON.stringify(data)
    }).then(res => res.text())
      .then(response => {
          alert('✅ Order submitted successfully!');
          form.reset();
          document.getElementById('confirmButton').style.display = 'none';
      });
});
</script>
</body>
</html>
