<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12V High Pressure Mini Pump</title>

<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}
.container {max-width:600px; margin:auto; background:#fff;}
header {background:#d32f2f; color:#fff; text-align:center; padding:30px;}
.section {padding:20px;}
.badge {background:#ffeb3b; padding:5px 10px; font-weight:bold;}
input, select {width:100%; padding:12px; margin:5px 0; border:1px solid #ddd; border-radius:10px;}
#countryCode{display:none;}

.slider {position:relative; border-radius:12px; overflow:hidden; background:#000;}
.slide {display:none;}
.slide img {width:100%; height:100%; object-fit:contain;}
.video-container {position:relative; padding-top:56.25%;}
.video-container iframe {position:absolute; width:100%; height:100%; top:0; left:0;}
.prev,.next{
 position:absolute; top:50%; transform:translateY(-50%);
 color:#fff; font-size:30px; cursor:pointer;
 background:rgba(0,0,0,0.4); padding:5px 10px;
}
.prev{left:10px;} .next{right:10px;}

.order-btn{
background:#ff5722;
color:#fff;
font-size:18px;
font-weight:bold;
padding:15px;
border:none;
border-radius:12px;
width:100%;
margin-bottom:15px;
cursor:pointer;
}
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.3/build/css/intlTelInput.css"/>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.5.3/build/js/intlTelInput.min.js"></script>

<script src="https://www.paypal.com/sdk/js?client-id=AZVBW8AbbYBa_AueMaS-rhE-Nah0E-g76trzpgzh_kj-nhB3qySFWX9hN0CzRjjNnRwQRaiRu1RH26Dl&currency=USD"></script>
</head>

<body>
<div class="container">

<header>
<span class="badge">HOT SALE</span>
<h1>12V HIGH PRESSURE MINI PUMP</h1>
<p>Portable • Powerful • Energy Saving</p>
</header>

<div class="section">
<p style="color:red;">⚠ Only 99 units left</p>
<p style="color:green;">✔ 8,980+ sold this month</p>
</div>

<div class="section">
<h3>🎥 Videos</h3>
<div class="slider" id="videoSlider">
<div class="slide"><div class="video-container"><iframe src="https://www.youtube.com/embed/QwbNfdYCYZ4"></iframe></div></div>
<div class="slide"><div class="video-container"><iframe src="https://www.youtube.com/embed/RWg9nFETMvY"></iframe></div></div>
<span class="prev" onclick="moveSlide('video',-1)">❮</span>
<span class="next" onclick="moveSlide('video',1)">❯</span>
</div>
</div>

<div class="section">
<h3>📸 Images</h3>
<div class="slider" id="imageSlider">
<div class="slide"><img src="https://raw.githubusercontent.com/Phamcuong1405/12V-MINI-WATER-PUMP/refs/heads/main/may-1.jpg"></div>
<div class="slide"><img src="https://raw.githubusercontent.com/Phamcuong1405/12V-MINI-WATER-PUMP/refs/heads/main/may-2%20(1).jpg"></div>
<div class="slide"><img src="https://raw.githubusercontent.com/Phamcuong1405/12V-MINI-WATER-PUMP/refs/heads/main/may3.jpg"></div>
<div class="slide"><img src="https://raw.githubusercontent.com/Phamcuong1405/12V-MINI-WATER-PUMP/c2e43ddc6d565ef048555b2bf89fe05236131707/ca0d3d038f943eca67852.jpg"></div>
<span class="prev" onclick="moveSlide('image',-1)">❮</span>
<span class="next" onclick="moveSlide('image',1)">❯</span>
</div>
</div>

<div class="section">
<button class="order-btn" onclick="scrollToForm()">🔥 ĐẶT HÀNG NGAY</button>

<form id="orderForm">
<input name="fullname" placeholder="Full Name" required>
<select name="phone_country_code" id="countryCode"></select>
<input id="phone" name="phone" type="tel" placeholder="Phone" required>

<input name="house_number" placeholder="House Number" required>
<input name="street_name" placeholder="Street" required>
<input name="city" placeholder="City" required>
<input name="state_province" placeholder="State" required>
<input name="postal_code" placeholder="ZIP" required>

<select id="package">
<option value="50">1 Unit - $50</option>
<option value="99">2 Units - $99</option>
</select>

<p id="priceBox">Price: <span id="converted_price">$50</span></p>

<input type="hidden" id="final_price">
<input type="hidden" id="final_currency">

<p id="formStatus"></p>
</form>

<p id="paypalNotice" style="color:red;">⚠ Fill all info before payment</p>
<div id="paypal-button-container" style="display:none;"></div>
</div>

</div>

<script>
// slider
let slideIndex={video:0,image:0};
function moveSlide(type,n){
 let s=document.querySelectorAll(`#${type}Slider .slide`);
 slideIndex[type]=(slideIndex[type]+n+s.length)%s.length;
 s.forEach((e,i)=>e.style.display=i===slideIndex[type]?"block":"none");
}
moveSlide('video',0);
moveSlide('image',0);

// scroll
function scrollToForm(){
 document.getElementById("orderForm").scrollIntoView({behavior:"smooth"});
}

// ===== PRO MAX PRICE SYSTEM =====
let exchangeRates={}, userCurrency="USD", userCountry="US";

const flags={VN:"🇻🇳",US:"🇺🇸",JP:"🇯🇵",KR:"🇰🇷",GB:"🇬🇧"};

function getAdjustedPrice(base){
 if(userCountry==="US") return base*1.2;
 if(userCountry==="JP") return base*1.1;
 return base;
}

function formatMoney(num,currency){
 if(currency==="VND") return num.toLocaleString("vi-VN")+"₫";
 return new Intl.NumberFormat(undefined,{style:'currency',currency}).format(num);
}

function loadUser(){
 fetch("https://ipapi.co/json")
 .then(r=>r.json())
 .then(d=>{
  userCurrency=d.currency||"USD";
  userCountry=d.country_code||"US";
  return fetch("https://api.exchangerate-api.com/v4/latest/USD");
 })
 .then(r=>r.json())
 .then(d=>{
  exchangeRates=d.rates;
  updatePrice();
 });
}

setInterval(loadUser,300000);
loadUser();

function updatePrice(){
 let base=parseFloat(document.getElementById("package").value);
 let usd=getAdjustedPrice(base);

 let rate=exchangeRates[userCurrency]||1;
 let local=usd*rate;

 let flag=flags[userCountry]||"🌍";

 document.getElementById("converted_price").innerHTML=
  flag+" $"+usd.toFixed(2)+" (~ "+formatMoney(local,userCurrency)+")";

 document.getElementById("final_price").value=usd.toFixed(2);
 document.getElementById("final_currency").value="USD";
}

document.getElementById("package").onchange=updatePrice;

// validate
const form=document.getElementById("orderForm");
const paypalBox=document.getElementById("paypal-button-container");
const notice=document.getElementById("paypalNotice");

function checkForm(){
 let valid=true;
 form.querySelectorAll("[required]").forEach(i=>{
   if(!i.value) valid=false;
 });
 paypalBox.style.display=valid?"block":"none";
 notice.style.display=valid?"none":"block";
}
form.oninput=checkForm;

// phone
const iti=window.intlTelInput(document.querySelector("#phone"),{
 initialCountry:"auto",
 geoIpLookup:cb=>{
  fetch("https://ipapi.co/json")
  .then(r=>r.json())
  .then(d=>cb(d.country_code))
  .catch(()=>cb("VN"));
 },
 separateDialCode:true,
 preferredCountries:["vn","us","jp"]
});

// paypal
paypal.Buttons({
createOrder:(d,a)=>{
 let price=document.getElementById("final_price").value;
 return a.order.create({purchase_units:[{amount:{value:price,currency_code:"USD"}}]});
},
onApprove:(d,a)=>{
 return a.order.capture().then(()=>{
   document.getElementById("formStatus").innerHTML="✅ Payment success";

   fetch("https://script.google.com/macros/s/AKfycbyACvyly4lQKYAUeCjkQ85i05nZJsICPF-HEYAUhxLaXyF9CTQmYI0EGJG0r8whMsY/exec",{
     method:"POST",
     body:JSON.stringify({
       name: form.fullname.value,
       phone: iti.getNumber(),
       address: form.house_number.value + ", " + form.street_name.value + ", " + form.city.value,
       zip: form.postal_code.value,
       package: document.getElementById("package").value
     })
   });
<!-- SHOP INFO -->
<div style="background:#111;color:#fff;padding:25px 20px;margin-top:20px;font-size:14px;line-height:1.6;">
  <h3 style="margin-top:0;">📍 Shop Information</h3>

  <p><strong>WhatsApp:</strong> 
    <a href="https://wa.me/84886073622" target="_blank" style="color:#4caf50;">
      +84 886 073 622
    </a>
  </p>

  <p><strong>Address:</strong><br>
    Ngõ 1 Tân Khai, Vĩnh Hưng,<br>
    Hoàng Mai, Hà Nội, Việt Nam
  </p>

  <p><strong>Email:</strong> 
    <a href="mailto:cuongkool1994@gmail.com" style="color:#ff9800;">
      cuongkool1994@gmail.com
    </a>
  </p>

  <hr style="border:0;border-top:1px solid #444;margin:15px 0;">

  <p style="font-size:12px;color:#aaa;">
    © 2026 Mini Pump Store. All rights reserved.
  </p>
</div>
 });
}
}).render('#paypal-button-container');

</script>

</body>
</html>
